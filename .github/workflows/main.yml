name: Build APK (Flutter)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter create . --platforms=android --project-name pagoya --org com.pagoya
          rm -rf test

      - name: Ajustar nombre y permiso de internet
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="PAGOYA"|' $M
          grep -q 'permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M

      - run: flutter pub get

      - name: Ícono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk PAGOYA.apk

      - name: Guardar APK en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PAGOYA-apk
          path: PAGOYA.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: PAGOYA v3.0.${{ github.run_number }}
          files: PAGOYA.apk
